name: Core tests

# Only the Core unit tests run here. The mod itself depends on net35 DLLs from the game that
# cannot be redistributed, so it cannot be built on a GitHub runner.
# Green means "the pure logic is sound", it does not mean "the mod builds".
# Building is verified locally with build.ps1.
on:
  push:
    branches: [ master, main ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet test tests/DisasterPlus.Core.Tests/DisasterPlus.Core.Tests.csproj --verbosity normal
